name: build-windows-exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests minecraft-launcher-lib

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name LightningCraftLauncher "Lightning Craft Launcher.py"

      - name: Show output
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: LightningCraftLauncher-windows
          path: dist/LightningCraftLauncher.exe
          if-no-files-found: error
