name: build-windows-exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.3,<7" requests minecraft-launcher-lib send2trash pillow

      - name: Build main EXE
        run: pyinstaller --noconfirm --clean LightningCraftLauncher.spec

      - name: Show output
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: LightningCraftLauncher-windows
          path: |
            dist/LightningCraftLauncher.exe
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item "Lightning Craft Launcher.py" "dist/Lightning.Craft.Launcher.py" -Force
          $files = @(
            "dist/LightningCraftLauncher.exe",
            "dist/Lightning.Craft.Launcher.py"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "LCL $tag"
          }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Release assets uploaded: $tag"

